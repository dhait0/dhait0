<svg width="960" height="160" viewBox="0 0 960 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Banner de Sebastián Camargo: Full Stack, Automatización e Integraciones">
  <rect width="960" height="160" fill="#0D1117" stroke="#30363D" stroke-width="2"/>

  <!-- Conexiones sutiles entre módulos -->
  <line x1="320" y1="80" x2="360" y2="80" stroke="#30363D" stroke-width="2"/>
  <line x1="600" y1="80" x2="640" y2="80" stroke="#30363D" stroke-width="2"/>

  <!-- Módulo 1: Full Stack -->
  <g>
    <rect x="40" y="30" width="240" height="100" rx="12" fill="#161B22" stroke="#22D3EE" stroke-width="1.5"/>
    <circle cx="80" cy="60" r="6" fill="#22D3EE"/>
    <circle cx="100" cy="60" r="6" fill="#60A5FA"/>
    <circle cx="120" cy="60" r="6" fill="#A78BFA"/>
    <line x1="80" y1="80" x2="120" y2="80" stroke="#22D3EE" stroke-width="2"/>
    <line x1="80" y1="80" x2="100" y2="100" stroke="#60A5FA" stroke-width="2"/>
    <line x1="100" y1="100" x2="120" y2="80" stroke="#A78BFA" stroke-width="2"/>
    <text x="160" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#E6EDF3">Full Stack</text>
  </g>

  <!-- Módulo 2: Automatización -->
  <g>
    <rect x="360" y="30" width="240" height="100" rx="12" fill="#161B22" stroke="#60A5FA" stroke-width="1.5"/>
    <rect x="400" y="55" width="60" height="50" rx="6" fill="none" stroke="#60A5FA" stroke-width="2"/>
    <polyline points="415,80 430,80 435,70 445,90 455,65 460,80" fill="none" stroke="#E6EDF3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="470" cy="60" r="5" fill="#A78BFA"/>
    <circle cx="485" cy="60" r="5" fill="#22D3EE"/>
    <text x="440" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#E6EDF3">Automatización</text>
  </g>

  <!-- Módulo 3: Integraciones -->
  <g>
    <rect x="640" y="30" width="280" height="100" rx="12" fill="#161B22" stroke="#A78BFA" stroke-width="1.5"/>
    <circle cx="680" cy="60" r="7" fill="none" stroke="#22D3EE" stroke-width="2"/>
    <circle cx="680" cy="60" r="3" fill="#22D3EE"/>
    <circle cx="720" cy="60" r="7" fill="none" stroke="#60A5FA" stroke-width="2"/>
    <circle cx="720" cy="60" r="3" fill="#60A5FA"/>
    <circle cx="760" cy="60" r="7" fill="none" stroke="#A78BFA" stroke-width="2"/>
    <circle cx="760" cy="60" r="3" fill="#A78BFA"/>
    <line x1="687" y1="67" x2="713" y2="53" stroke="#E6EDF3" stroke-width="1.5"/>
    <line x1="727" y1="67" x2="753" y2="53" stroke="#E6EDF3" stroke-width="1.5"/>
    <text x="720" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#E6EDF3">Integraciones</text>
  </g>

</svg>